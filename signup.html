<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Walking E-Library Hub - Sign Up</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .signup-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;

            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #1e3a8a;
            color: white;

            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #172554;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #1e3a8a;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>Walking E-Library Hub</h1>

    <p class="subtitle">Create Student Account</p>

    <form id="signupForm">

        <input
            type="text"
            id="lrn"
            placeholder="LRN"
            maxlength="12"
            inputmode="numeric"
            required
        >

        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required
        >

        <select id="gradeLevel" required>
            <option value="">Select Grade Level</option>
<option value="Grade 7">Grade 7</option>
<option value="Grade 8">Grade 8</option>
<option value="Grade 9">Grade 9</option>
<option value="Grade 10">Grade 10</option>
<option value="Grade 11">Grade 11</option>
<option value="Grade 12">Grade 12</option>
        </select>

        <input
            type="text"
            id="section"
            placeholder="Section"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="login.html">Log in</a>
    </div>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");

signupForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const lrn = document.getElementById("lrn").value.trim();
    const fullName = document.getElementById("fullName").value.trim();
    const gradeLevel = document.getElementById("gradeLevel").value;
    const section = document.getElementById("section").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    message.textContent = "";
    message.style.color = "red";

    if (!/^\d{12}$/.test(lrn)) {
        message.textContent = "LRN must be exactly 12 digits.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    message.textContent = "Creating account...";
    message.style.color = "#333";

    // Hidden email used only internally by Supabase
    const internalEmail = `${lrn}@walkingelibrary.local`;

    const { data, error } = await supabase.auth.signUp({
        email: internalEmail,
        password: password,

        options: {
            data: {
                full_name: fullName,
                lrn: lrn,
                grade_level: gradeLevel,
                section: section,
                role: "student"
            }
        }
    });

    if (error) {

        console.error("Signup error:", error);

        message.textContent = error.message;
        message.style.color = "red";

        return;
    }

    console.log("Account created:", data);

    message.textContent = "Account created successfully!";
    message.style.color = "green";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
