<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walking E-Library Hub — Sign Up</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; background:#f3f6fb; }
    .card { width:min(420px,92vw); background:white; padding:32px; border-radius:18px; box-shadow:0 10px 35px rgba(0,0,0,.10); }
    input,button { width:100%; padding:13px; margin-top:10px; border-radius:10px; border:1px solid #ccd3df; font-size:15px; }
    button { cursor:pointer; border:0; background:#1d4ed8; color:white; }
    a { color:#1d4ed8; }
    #message { min-height:24px; margin-top:12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create Student Account</h1>
    <form id="signupForm">
      <input id="fullName" type="text" placeholder="Full name" required>
      <input id="email" type="email" placeholder="Student email" required>
      <input id="password" type="password" placeholder="Password" minlength="8" required>
      <button type="submit">Create account</button>
    </form>
    <p id="message"></p>
    <p>Already registered? <a href="login.html">Log in</a></p>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.querySelector("#signupForm");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Creating account...";

      const fullName = document.querySelector("#fullName").value.trim();
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName } }
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (data.session) {
        window.location.replace("dashboard.html");
      } else {
        message.textContent =
          "Account created. Check your email if confirmation is required, then log in.";
      }
    });
  </script>
</body>
</html>
