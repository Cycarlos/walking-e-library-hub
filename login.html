<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walking E-Library Hub — Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; background: #f3f6fb;
    }
    .card {
      width: min(420px, 92vw); background: white; padding: 32px;
      border-radius: 18px; box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }
    h1 { margin-top: 0; }
    input, button {
      width: 100%; padding: 13px; margin-top: 10px;
      border-radius: 10px; border: 1px solid #ccd3df;
      font-size: 15px;
    }
    button { cursor: pointer; border: 0; background: #1d4ed8; color: white; }
    a { color: #1d4ed8; }
    #message { min-height: 24px; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Walking E-Library Hub</h1>
    <p>Student Login</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Student email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>

    <p id="message"></p>
    <p>Don't have an account? <a href="signup.html">Create one</a></p>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.querySelector("#loginForm");
    const message = document.querySelector("#message");

    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const { data: profile } = await supabase.from("profiles").select("role").eq("id", session.user.id).single();
      window.location.replace(profile?.role === "admin" ? "admin.html" : "dashboard.html");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Signing in...";

      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      const { error } = await supabase.auth.signInWithPassword({
        email, password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      const { data: profile, error: profileError } = await supabase.from("profiles").select("role").eq("id", data.user.id).single();
      if (profileError) {
        console.error("Profile error:", profileError);
        message.textContent = "Could not load your account profile.";
        message.style.color = "red";
        return;
      }
      window.location.replace(profile.role === "admin" ? "admin.html" : "dashboard.html");
    });
  </script>
</body>
</html>
