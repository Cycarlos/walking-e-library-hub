
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walking E-Library Hub — Login</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 0;
      font-family: Arial, sans-serif;
      color: #f7f5ff;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(87,70,210,.38), transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(130,55,220,.3), transparent 45%),
        linear-gradient(145deg, #070b25, #17164b 55%, #0b1235);
    }

    .card {
      width: min(520px, 92vw);
      padding: 32px;
      color: #f7f5ff;
      background: rgba(20, 24, 68, .96);
      border: 1px solid rgba(164, 125, 255, .55);
      border-top: 4px solid #9865ff;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }

    h1 {
      margin-top: 0;
      color: #ffffff;
      text-align: center;
      font-size: clamp(25px, 5vw, 34px);
    }

    .subtitle {
      color: #c7b5ff;
      text-align: center;
      margin-bottom: 24px;
    }

    input, button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      color: #ffffff;
      background: #0b1030;
      border: 1px solid #625a99;
    }

    input::placeholder { color: #c2bddb; }

    input:focus {
      outline: 2px solid #9865ff;
      outline-offset: 2px;
    }

    button {
      cursor: pointer;
      border: 0;
      color: white;
      font-weight: bold;
      background: linear-gradient(110deg, #315be8, #8654e9);
    }

    button:hover { filter: brightness(1.12); }

    a { color: #c7b5ff; }

    #message {
      min-height: 24px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .register {
      margin-top: 24px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card { padding: 25px 21px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Walking E-Library Hub</h1>
    <p class="subtitle">Student Login</p>

    <form id="loginForm">
      <input
        id="lrn"
        type="text"
        placeholder="Student LRN"
        maxlength="12"
        inputmode="numeric"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">Log in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="register">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.querySelector("#loginForm");
    const message = document.querySelector("#message");

    const {
      data: { session }
    } = await supabase.auth.getSession();

    if (session) {
      const { data: profile } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .single();

      window.location.replace(
        profile?.role === "admin" ? "admin.html" : "dashboard.html"
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const lrn = document.querySelector("#lrn").value.trim();
      const password = document.querySelector("#password").value;

      message.textContent = "Signing in...";
      message.style.color = "#c7b5ff";

      if (!/^\d{12}$/.test(lrn)) {
        message.textContent = "LRN must be exactly 12 digits.";
        message.style.color = "#ff8585";
        return;
      }

      const internalEmail = `${lrn}@walkingelibraryhub.com`;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: internalEmail,
        password
      });

      if (error) {
        console.error("Login error:", error);
        message.textContent = "Incorrect LRN or password.";
        message.style.color = "#ff8585";
        return;
      }

      const { data: profile, error: profileError } = await supabase
        .from("profiles")
        .select("id, full_name, role, lrn, grade_level, section")
        .eq("id", data.user.id)
        .single();

      if (profileError || !profile) {
        console.error("Profile error:", profileError);
        message.textContent = "Could not load your account profile.";
        message.style.color = "#ff8585";
        return;
      }

      const { data: sessionRecord, error: sessionError } =
        await supabase.rpc("create_login_session");

      if (sessionError) {
        console.error("Session recording error:", sessionError);
        message.textContent =
          "Login worked, but the session could not be recorded.";
        message.style.color = "#ffc078";
        return;
      }

      localStorage.setItem(
        "walking_e_library_session_id",
        sessionRecord
      );

      message.textContent = "Login successful!";
      message.style.color = "#a7f3d0";

      setTimeout(() => {
        window.location.replace(
          profile.role === "admin" ? "admin.html" : "dashboard.html"
        );
      }, 500);
    });
  </script>
</body>
</html>
