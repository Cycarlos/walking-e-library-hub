<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Walking E-Library Hub — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
    }

    .card {
      width: min(420px, 92vw);
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccd3df;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      border: 0;
      background: #1d4ed8;
      color: white;
    }

    a {
      color: #1d4ed8;
    }

    #message {
      min-height: 24px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Walking E-Library Hub</h1>

    <p>Student Login</p>

    <form id="loginForm">

      <input
        id="lrn"
        type="text"
        placeholder="Student LRN"
        maxlength="12"
        inputmode="numeric"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Log in
      </button>

    </form>

    <p id="message"></p>

    <p>
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>

  </main>

  <script type="module">

    import { supabase } from "./supabase.js";

    const form = document.querySelector("#loginForm");
    const message = document.querySelector("#message");

    // Check if already logged in
    const {
      data: { session }
    } = await supabase.auth.getSession();

    if (session) {

      const { data: profile } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .single();

      window.location.replace(
        profile?.role === "admin"
          ? "admin.html"
          : "dashboard.html"
      );
    }

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const lrn = document.querySelector("#lrn").value.trim();
      const password = document.querySelector("#password").value;

      message.textContent = "Signing in...";
      message.style.color = "#333";

      // Check LRN format
      if (!/^\d{12}$/.test(lrn)) {

        message.textContent =
          "LRN must be exactly 12 digits.";

        message.style.color = "red";

        return;
      }

      // Same hidden email format used during signup
      const internalEmail =
        `${lrn}@walkingelibraryhub.com`;

      // LOGIN
      const {
        data,
        error
      } = await supabase.auth.signInWithPassword({
        email: internalEmail,
        password: password
      });

      if (error) {

        console.error("Login error:", error);

        message.textContent =
          "Incorrect LRN or password.";

        message.style.color = "red";

        return;
      }

      // Load profile after successful login
      const {
        data: profile,
        error: profileError
      } = await supabase
        .from("profiles")
        .select(
          "id, full_name, role, lrn, grade_level, section"
        )
        .eq("id", data.user.id)
        .single();

      if (profileError || !profile) {

        console.error(
          "Profile error:",
          profileError
        );

        message.textContent =
          "Could not load your account profile.";

        message.style.color = "red";

        return;
      }

      // Record login session
      const {
        data: sessionRecord,
        error: sessionError
      } = await supabase.rpc(
        "create_login_session"
      );

      if (sessionError) {

        console.error(
          "Session recording error:",
          sessionError
        );

        message.textContent =
          "Login worked, but the session could not be recorded.";

        message.style.color = "orange";

        return;
      }

      // Save session ID
      localStorage.setItem(
        "walking_e_library_session_id",
        sessionRecord
      );

      message.textContent =
        "Login successful!";

      message.style.color = "green";

      // Redirect
      setTimeout(() => {

        if (profile.role === "admin") {
          window.location.replace("admin.html");
        } else {
          window.location.replace("dashboard.html");
        }

      }, 500);

    });

  </script>

</body>
</html>
