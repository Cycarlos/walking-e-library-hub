<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Walking E-Library Hub — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    button {
      padding: 10px 15px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .online {
      color: green;
      font-weight: bold;
    }

    .offline {
      color: #777;
      font-weight: bold;
    }

    .table-container {
      overflow-x: auto;
    }
  </style>
</head>

<body>

<header>
  <strong>Walking E-Library Hub — Admin</strong>
  <button id="logout">Log out</button>
</header>

<main>

  <section class="card">

    <h1>Student Login Activity</h1>

    <p id="status">Loading...</p>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>LRN</th>
            <th>Student Name</th>
            <th>Grade Level</th>
            <th>Section</th>
            <th>Login Time</th>
            <th>Last Seen</th>
            <th>Status</th>
            <th>Logout Time</th>
          </tr>
        </thead>

        <tbody id="sessions"></tbody>

      </table>

    </div>

  </section>

</main>

<script type="module">

import { requireAdmin, signOut } from "./auth.js";
import { supabase } from "./supabase.js";

const status = document.getElementById("status");
const tbody = document.getElementById("sessions");
const logoutButton = document.getElementById("logout");

const admin = await requireAdmin();

if (!admin) {
  throw new Error("Not authorized");
}

async function loadSessions() {

  status.textContent = "Loading...";

  const { data, error } =
    await supabase.rpc("get_admin_login_sessions");

  if (error) {

    console.error("Admin session error:", error);

    status.textContent =
      "Error loading login activity: " + error.message;

    return;
  }

  status.textContent =
    `${data.length} login session(s) found.`;

  tbody.innerHTML = data.map(row => {

    const isOnline = !row.logout_at;

    return `
      <tr>

        <td>${escapeHtml(row.lrn || "—")}</td>

        <td>${escapeHtml(row.full_name || "Unnamed")}</td>

        <td>${escapeHtml(row.grade_level || "—")}</td>

        <td>${escapeHtml(row.section || "—")}</td>

        <td>${formatDate(row.login_at)}</td>

        <td>${formatDate(row.last_seen_at)}</td>

        <td class="${isOnline ? "online" : "offline"}">
          ${isOnline ? "ONLINE" : "OFFLINE"}
        </td>

        <td>
          ${row.logout_at ? formatDate(row.logout_at) : "—"}
        </td>

      </tr>
    `;

  }).join("");
}

function formatDate(value) {

  if (!value) {
    return "—";
  }

  return new Date(value).toLocaleString();
}

function escapeHtml(value) {

  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[char]));

}

logoutButton.addEventListener("click", signOut);

loadSessions();

setInterval(loadSessions, 10000);

</script>

</body>
</html>
